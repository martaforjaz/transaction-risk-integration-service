services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: risk
      POSTGRES_USER: risk
      POSTGRES_PASSWORD: risk
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risk"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - state:/var/lib/postgresql/data
  risk:
    image: python:3.12-alpine
    command: ["python","/app/mock-risk.py"]
    volumes:
      - ./mock-risk.py:/app/mock-risk.py:ro
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/risk
      RISK_URL: http://risk:8090/evaluate
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      risk:
        condition: service_started
volumes:
  state:

