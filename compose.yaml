services:
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - broker:/var/lib/kafka/data
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: risk
      POSTGRES_USER: risk
      POSTGRES_PASSWORD: risk
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risk"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - state:/var/lib/postgresql/data
  risk:
    image: python:3.12-alpine
    command: ["python","/app/mock-risk.py"]
    volumes:
      - ./mock-risk.py:/app/mock-risk.py:ro
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/risk
      RISK_URL: http://risk:8090/evaluate
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
      db:
        condition: service_healthy
      risk:
        condition: service_started
volumes:
  state:
  broker:

